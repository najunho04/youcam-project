# main 의 CI 가 통과하면 백엔드를 EC2 에 배포한다. 프론트는 Vercel Git 연동이 자동 배포한다.
# GitHub OIDC → AWS 롤 → 이미지를 빌드해 ECR 에 push → SSM Run Command 로 EC2 가 pull·재기동 (인바운드 SSH 불필요)
# 필요한 repository variables: AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID, ECR_REPOSITORY
# EC2 의 /home/ubuntu/colorfit/.env 는 직접 관리한다 (레포에 없음).
name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        id: image
        run: |
          image="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$(git rev-parse HEAD)"
          docker buildx build project/backend --push --tag "$image" \
            --cache-from type=gha --cache-to type=gha,mode=max
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Pull and restart on EC2
        run: |
          compose_base64=$(base64 -w0 project/docker-compose.yml)
          caddyfile_base64=$(base64 -w0 project/Caddyfile)
          registry="${{ steps.ecr.outputs.registry }}"
          image="${{ steps.image.outputs.uri }}"
          jq -n --arg compose "$compose_base64" --arg caddy "$caddyfile_base64" \
                --arg registry "$registry" --arg image "$image" --arg region "$AWS_REGION" '{commands: [
            "set -e",
            "cd /home/ubuntu/colorfit",
            "echo \($compose) | base64 -d > docker-compose.yml",
            "echo \($caddy) | base64 -d > Caddyfile",
            "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
            "export BACKEND_IMAGE=\($image)",
            "docker compose --profile prod pull backend caddy",
            "docker compose --profile prod up -d --no-build backend caddy",
            "docker image prune -af"
          ]}' > /tmp/parameters.json
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters file:///tmp/parameters.json \
            --query Command.CommandId --output text)
          for attempt in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -40
          echo "status=$status"
          test "$status" = Success
