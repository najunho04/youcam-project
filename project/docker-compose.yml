# 개발: make dev → db 만 띄움 / 배포(EC2): make up → backend + caddy (DB 는 Neon, 프론트는 Vercel)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: colorfit
      POSTGRES_PASSWORD: colorfit
      POSTGRES_DB: colorfit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colorfit"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    profiles: ["prod"]
    build: ./backend
    env_file: .env
    volumes:
      - model-cache:/app/.cache/huggingface
    restart: unless-stopped

  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    environment:
      API_HOST: ${API_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  model-cache:
  caddy-data:
