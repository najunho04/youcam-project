<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColorFit Main Mock</title>
<style>
/* ColorFit 메인 목업: 먹색 바탕 · 흰 글씨 · 반원(부채꼴)으로 펼친 코디 카드가 바퀴처럼 돌며 메인 카드가 바뀐다 */
:root {
  --color-base: #050505;
  --color-text: #f4f4f4;
  --color-muted: #8a8a8a;
  --card-height: min(60vh, 560px);
  --card-width: calc(var(--card-height) * 0.8);
  /* 카드 사이 각도와 회전 중심(카드 아래 멀리) */
  --step-angle: 15deg;
  --pivot-depth: 250%;
  --spin-duration: 1500ms;
  --spin-ease: cubic-bezier(0.65, 0.05, 0.25, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--color-base); color: var(--color-text); }
body { font-family: 'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Pretendard', sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }

.brand {
  position: fixed; top: 6px; left: 12px; z-index: 20; margin: 0;
  font: 500 clamp(39px, 6.3vw, 118px)/0.85 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -0.065em;
}
.menu {
  position: fixed; left: 12px; top: 50%; translate: 0 -50%; z-index: 20;
  font: 500 clamp(31px, 4.9vw, 90px)/0.85 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -0.06em;
}
.menu a { position: relative; color: inherit; text-decoration: none; padding-right: 0.06em; }
.menu a::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -0.04em; height: max(1px, 0.035em); background: currentColor;
  transform: scaleX(0); transform-origin: right; transition: transform 350ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.menu a:hover::after { transform: scaleX(1); transform-origin: left; }
.language { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: flex; gap: 10px; font-size: 11px; letter-spacing: 0.04em; }
.language span { color: var(--color-muted); }
.language span.is-active { color: var(--color-text); border-bottom: 1px solid currentColor; }

/* ---------- 반원 카드 바퀴 ---------- */
.wheel { position: fixed; inset: 0; }
.card {
  position: absolute; left: 56%; top: 47%;
  width: var(--card-width); height: var(--card-height);
  margin: calc(var(--card-height) / -2) 0 0 calc(var(--card-width) / -2);
  padding: 0; border: 0; border-radius: 4px; overflow: hidden; cursor: pointer;
  background: #e8e2da; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
  transform-origin: 50% var(--pivot-depth);
  transition:
    transform var(--spin-duration) var(--spin-ease),
    filter var(--spin-duration) var(--spin-ease),
    opacity calc(var(--spin-duration) * 0.7) var(--spin-ease);
  will-change: transform, filter, opacity;
}
.card.is-jumping { transition: none; }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; pointer-events: none; }
.card:focus-visible { outline: 2px solid #fff; outline-offset: 8px; }

.caption {
  position: fixed; left: 56%; bottom: 26px; translate: -50% 0; z-index: 20;
  display: grid; justify-items: center; gap: 8px; text-align: center;
}
.caption-count { font-size: 11px; letter-spacing: 0.08em; color: var(--color-text); font-variant-numeric: tabular-nums; }
.caption-hint { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-muted); }
.progress { width: 120px; height: 1px; background: rgba(244, 244, 244, 0.18); overflow: hidden; }
.progress-fill { height: 100%; background: var(--color-text); transform-origin: left; transform: scaleX(0); }

.toast {
  position: fixed; left: 50%; top: 24px; translate: -50% 0; z-index: 30; padding: 10px 14px;
  background: #141414; color: var(--color-text); font-size: 12px; border-radius: 2px;
  box-shadow: inset 0 0 0 1px rgba(244, 244, 244, 0.14); opacity: 0; transition: opacity 300ms;
}
.toast.is-visible { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .card { transition: opacity 300ms linear; }
}
</style>
</head>
<body>

<nav class="menu"><a href="#" id="login">LOGIN</a></nav>

  <span class="caption-hint">Click a card to start</span>
</div>

  ];
  /* 바퀴가 끊기지 않게 다섯 장을 두 번 깔아 10장으로 돈다. 가운데 ±3칸까지만 보이고, 그 너머에서 반대편으로 넘어간다 */
  const CARD_COUNT = LOOKS.length * 2;
  const VISIBLE_RANGE = 3;
  const HOLD_MILLISECONDS = 3400;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const wheel = document.getElementById('wheel');
  const count = document.getElementById('count');
  const progress = document.getElementById('progress');
  const toast = document.getElementById('toast');

  const cards = Array.from({ length: CARD_COUNT }, (_, index) => {
    const look = LOOKS[index % LOOKS.length];
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.innerHTML = `<img src="${look.src}" alt="${look.name} 코디">`;
    card.addEventListener('click', () => handleCardClick(index));
    wheel.appendChild(card);
    return { element: card, offset: null };
  });

  let activeIndex = 0;
  let holdTimer = 0;

  /** 가운데(메인)에서 몇 칸 떨어졌는지. -5 ~ 4 범위로 접는다 */
  function centeredOffset(index) {
    let offset = (index - activeIndex) % CARD_COUNT;
    if (offset < -CARD_COUNT / 2) offset += CARD_COUNT;
    if (offset >= CARD_COUNT / 2) offset -= CARD_COUNT;
    return offset;
  }

  function layout() {
    cards.forEach((card, index) => {
      const offset = centeredOffset(index);
      const distance = Math.abs(offset);
      // 반대편으로 넘어가는 카드는 보이지 않는 자리에서 애니메이션 없이 옮긴다
      const isJumping = card.offset !== null && Math.abs(offset - card.offset) > 1;
      card.element.classList.toggle('is-jumping', isJumping);
      card.element.style.zIndex = String(10 - distance);
      card.element.style.transform = `rotate(calc(var(--step-angle) * ${offset})) scale(${1 - distance * 0.07})`;
      // 옆 카드는 불투명하게 두고 밝기만 낮춘다 (반투명이면 겹친 카드가 비쳐 지저분하다)
      card.element.style.filter = `brightness(${1 - Math.min(distance, VISIBLE_RANGE) * 0.2})`;
      card.element.style.opacity = distance > VISIBLE_RANGE ? '0' : '1';
      card.element.tabIndex = offset === 0 ? 0 : -1;
      card.element.setAttribute('aria-current', offset === 0 ? 'true' : 'false');
      if (isJumping) void card.element.offsetWidth;
      card.element.classList.remove('is-jumping');
      card.offset = offset;
    });
    count.textContent = `${String((activeIndex % LOOKS.length) + 1).padStart(2, '0')} / ${String(LOOKS.length).padStart(2, '0')}`;
  }

  /** 다음 카드가 돌아서 메인이 되기까지 남은 시간을 진행 막대로 보여 준다 */
  function startHold() {
    clearTimeout(holdTimer);
    if (reducedMotion) return;
    progress.style.transition = 'none';
    progress.style.transform = 'scaleX(0)';
    void progress.offsetWidth;
    progress.style.transition = `transform ${HOLD_MILLISECONDS}ms linear`;
    progress.style.transform = 'scaleX(1)';
    holdTimer = setTimeout(() => spinTo(activeIndex + 1), HOLD_MILLISECONDS);
  }

  function spinTo(index) {
    activeIndex = ((index % CARD_COUNT) + CARD_COUNT) % CARD_COUNT;
    layout();
    startHold();
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('is-visible');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('is-visible'), 1600);
  }

  /** 메인 카드를 누르면 시작(목업에서는 안내만), 옆 카드를 누르면 그 카드가 메인으로 돌아온다 */
  function handleCardClick(index) {
    const offset = centeredOffset(index);
    if (offset === 0) showToast('→ 로그인 상태면 이어하기, 아니면 로그인 화면으로 이동 (목업)');
    else spinTo(activeIndex + offset);
  }

  document.getElementById('login').addEventListener('click', (event) => {
    event.preventDefault();
    showToast('→ 로그인 화면으로 이동 (목업)');
  });
  addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight') spinTo(activeIndex + 1);
    else if (event.key === 'ArrowLeft') spinTo(activeIndex - 1);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(holdTimer);
    else startHold();
  });

  layout();
  startHold();
})();
</script>
